badges_ticker_location:
  default: "main"
  type: enum
  choices:
    - main
    - sidebar
    - none

badges_ticker_count:
  default: 6
  type: integer
  min: 1
  max: 50

badges_ticker_badge_ids:
  type: list
  default: ""

badges_ticker_tiers:
  type: enum
  default: "all"
  choices:
    - all
    - gold
    - silver
    - bronze
