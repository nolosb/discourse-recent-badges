featured_badges_location:
  default: "main"
  type: enum
  choices:
    - main
    - sidebar
    - none

featured_badges_count:
  default: 6
  type: integer
  min: 1
  max: 50

featured_badges_badge_ids:
  type: list
  default: ""

featured_badges_tiers:
  type: enum
  default: "all"
  choices:
    - all
    - gold
    - silver
    - bronze
